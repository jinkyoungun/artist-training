<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />

<title>Artist Training · 52주 프로 아티스트 훈련</title>
<style>
:root{--bg:#0d0f12;--card:#171a1f;--card2:#20242b;--text:#f2f3f5;--muted:#9ba3ad;--accent:#d4a64a;--accent2:#7eb0ff;--ok:#70c58f;--danger:#e38181;--line:#2c323b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}.app{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.hero{padding:10px 2px 16px}.eyebrow{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.08em}.hero h1{font-size:28px;line-height:1.16;margin:7px 0 8px}.muted{color:var(--muted);font-size:14px;line-height:1.6}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 28px rgba(0,0,0,.15)}.card h2{font-size:18px;margin:0 0 8px}.card h3{font-size:15px;margin:0}.pill{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;background:var(--card2);font-size:12px;color:#d9dee5}.pill.accent{background:rgba(212,166,74,.16);color:#f0cb79}.pill.blue{background:rgba(126,176,255,.15);color:#a9cbff}.progress{height:9px;background:#2a2f36;border-radius:99px;overflow:hidden;margin-top:10px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f0cc83);width:0;border-radius:99px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:var(--card2);border-radius:14px;padding:12px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}.task:first-of-type{border-top:0}.check{width:26px;height:26px;border-radius:8px;border:1.5px solid #59616d;background:transparent;display:grid;place-items:center;color:#0d0f12;flex:0 0 auto;margin-top:1px}.task.done .check{background:var(--ok);border-color:var(--ok)}.task.done .check:after{content:"✓";font-weight:900}.task.done .task-title{text-decoration:line-through;color:#79818b}.task-title{font-weight:700;font-size:15px}.task-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}.section-note{font-size:12px;color:var(--muted);margin-top:6px}.focus{border-left:3px solid var(--accent);padding-left:12px;margin:12px 0}.focus b{display:block;margin-bottom:3px}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(13,15,18,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));justify-content:center}.tabbar{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.tab{border:0;background:transparent;color:#929aa4;border-radius:12px;padding:8px 3px;font-size:10px}.tab b{display:block;font-size:17px;margin-bottom:2px}.tab.active{color:var(--accent);background:rgba(212,166,74,.08)}.view{display:none}.view.active{display:block}.week-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.week-btn{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:12px 5px;border-radius:12px;font-size:12px}.week-btn.current{border-color:var(--accent);color:#f0cb79}.week-btn.done{box-shadow:inset 0 -3px 0 var(--ok)}.phase{margin:14px 0 6px;padding:13px;border-radius:14px;background:var(--card2)}.phase b{font-size:14px}.phase p{margin:5px 0 0;font-size:12px;color:var(--muted);line-height:1.5}.dayline{padding:12px 0;border-top:1px solid var(--line)}.dayline:first-child{border-top:0}.dayline strong{font-size:14px}.dayline small{display:block;color:var(--muted);margin-top:3px}.review textarea{width:100%;min-height:82px;background:#101216;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;resize:vertical;margin:5px 0 10px}.settings label{display:block;font-size:13px;color:var(--muted);margin:13px 0 6px}.settings input,.settings select{width:100%;background:#111419;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}.btn{border:0;border-radius:12px;padding:11px 13px;background:var(--accent);color:#16130d;font-weight:800}.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}.quote{font-size:17px;line-height:1.55;font-weight:700}.tiny{font-size:11px;color:var(--muted)}
@media(max-width:390px){.hero h1{font-size:25px}.stats{grid-template-columns:1fr 1fr 1fr}.stat{padding:10px 8px}.week-grid{grid-template-columns:repeat(4,1fr)}}
.settings{min-width:0;overflow:hidden}
.settings input,.settings select{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box}
.settings input[type="date"]{display:block;width:100%;inline-size:100%;max-width:100%;max-inline-size:100%;min-width:0;min-inline-size:0;box-sizing:border-box;overflow:hidden;-webkit-appearance:none;appearance:none;font-size:16px;padding-right:12px}
.settings input[type="date"]::-webkit-date-and-time-value{min-width:0;text-align:left}
.settings input[type="date"]::-webkit-calendar-picker-indicator{margin-left:auto}
</style>
<link rel="stylesheet" href="./progress-addon.css?v=20260908-final" />
</head>
<body>
<div class="app">
<section id="today" class="view active"></section>
<section id="week" class="view"></section>
<section id="roadmap" class="view"></section>
<section id="review" class="view"></section>
<section id="settings" class="view"></section>
</div>
<nav class="tabs"><div class="tabbar">
<button class="tab active" data-view="today"><b>◉</b>오늘</button>
<button class="tab" data-view="week"><b>▦</b>이번 주</button>
<button class="tab" data-view="roadmap"><b>52</b>로드맵</button>
<button class="tab" data-view="review"><b>✎</b>기록</button>
<button class="tab" data-view="settings"><b>⚙</b>설정</button>
</div></nav>
<script>
const STORAGE='proArtist52_v2';
const defaults={startDate:'2026-09-14', longFridayOnOdd:true, checks:{}, notes:{}, targetName:'Black Naraka / Key Art'};
let data=Object.assign({},defaults,JSON.parse(localStorage.getItem(STORAGE)||'{}'));
function save(){localStorage.setItem(STORAGE,JSON.stringify(data))}
const phases=[
 {from:1,to:13,title:'PHASE 1 · 눈과 판단 재정비',desc:'Composition · Value · Edge · Light. 잘 그리는 것보다 큰 덩어리와 시선 설계.',goal:'구도와 밸류를 빠르게 판단한다.'},
 {from:14,to:26,title:'PHASE 2 · 장면 설계',desc:'Story · Camera · Staging · Environment · Character interaction.',goal:'한 장 안에서 이야기와 카메라를 설계한다.'},
 {from:27,to:39,title:'PHASE 3 · 프로덕션 렌더',desc:'Lighting · Color · Material · Painterly Rendering · Detail hierarchy.',goal:'디자인을 유지하며 완성도를 올린다.'},
 {from:40,to:52,title:'PHASE 4 · Key Art / Portfolio 통합',desc:'썸네일 → 밸류 → 컬러 → 렌더 → 피드백 → 완성작. 포트폴리오 3–5장 목표.',goal:'세계적 수준을 겨냥한 완성작으로 통합한다.'}
];
const weeklyFocus=[
'3 Value Notan · 큰 명암 3단계','Focal Point · 대비 집중','실루엣 가독성','Hard / Soft Edge','Light 방향과 Form Shadow','Foreground / Midground / Background','Scale과 깊이','삼각형·S·대각 구도','Negative Space','카메라 높이 변화','Wide / Medium / Close Shot','Master Study 종합','PHASE 1 테스트 · 동일 주제 12 썸네일',
'Story Moment 선택','캐릭터 관계와 거리','Staging · 시선 방향','Low Angle / High Angle','Foreground Framing','환경으로 서사 전달','동작과 정지의 대비','빛으로 이야기 강조','인물+환경 비율','전경 오브젝트 연출','Atmospheric Perspective','시퀀스 3컷 설계','Boss Arena / Encounter · PHASE 2 테스트',
'Warm / Cool 구조','Local Color vs Light Color','Material 구분','Skin / Cloth / Metal','Fog / Smoke / Dust','Night Lighting','3-point Lighting 응용','디테일 위계','Brush Economy','Painterly Edge','Color Script 5안','Master Painting Study','PHASE 3 렌더 테스트',
'Key Art 01 썸네일','Key Art 01 밸류','Key Art 01 컬러·라이팅','Key Art 01 완성·리뷰','Key Art 02 썸네일','Key Art 02 밸류','Key Art 02 컬러·라이팅','Key Art 02 완성·리뷰','Key Art 03 썸네일','Key Art 03 밸류','Key Art 03 컬러·라이팅','Key Art 03 완성·리뷰','포트폴리오 선별·재수정'
];
const dayNames=['일','월','화','수','목','금','토'];
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function currentWeek(date=new Date()){const start=parseDate(data.startDate);const diff=Math.floor((new Date(date.getFullYear(),date.getMonth(),date.getDate(),12)-start)/86400000);return Math.max(1,Math.min(52,Math.floor(diff/7)+1))}
function phaseFor(w){return phases.find(p=>w>=p.from&&w<=p.to)||phases[3]}
function isLongFriday(w){return data.longFridayOnOdd ? w%2===1 : w%2===0}
function dayType(day,w){if(day===0)return 'rest';if(day===1||day===3)return 'long';if(day===2||day===4)return 'short';if(day===5)return isLongFriday(w)?'long':'short';if(day===6)return 'portfolio'}
function taskSet(type,w){const focus=weeklyFocus[w-1];const base={
 long:[['아침 맨몸운동 + 샤워/식사','40–60분 · 몸을 깨운 뒤 작업 시작'],['크로키 / Gesture','30분 · 동세와 큰 흐름, 완성 금지'],['Composition Thumbnail','30분 · 5분 × 6안, Story → Camera → Value'],[w<=13?'Value / Notan Study':'주차 핵심 Skill Study','30분 · '+focus],['작품 분석','30분 · Story / Composition / Value / Focal / Edge'],['Deep Work · 실제 작품','3시간 전후 · '+data.targetName+' · 연습이 아니라 작품 진행'],['10분 Art Review','KEEP / PROBLEM / NEXT 기록']],
 short:[['아침 맨몸운동 + 샤워/식사','40–60분'],['크로키 / Gesture','20–30분'],['Composition Thumbnail','30분 · 5분 × 6안'],['Master Study / Skill Study','45–60분 · '+focus],['짧은 이론 / 리뷰','15–20분 · 오늘 한 가지 판단 기준만 정리']],
 portfolio:[['Portfolio Deep Work','3시간 · '+data.targetName+' · 크로키/강의 없이 작품만'],['주간 Art Review','20–30분 · KEEP / PROBLEM / NEXT'],['다음 주 한 가지 목표 설정','10분 · 욕심내지 말고 가장 큰 약점 1개']],
 rest:[['완전 휴식','그림 공부를 하지 않아도 된다. 운동·산책·영화·게임·가족 시간.']]
 };return base[type]}
function checkKey(date,idx){return date.toISOString().slice(0,10)+'_'+idx}
function completionForDate(date){const w=currentWeek(date),tasks=taskSet(dayType(date.getDay(),w),w);let n=0;tasks.forEach((_,i)=>{if(data.checks[checkKey(date,i)])n++});return {n,total:tasks.length,pct:Math.round(n/tasks.length*100)}}
function weekDates(w){const s=parseDate(data.startDate);return Array.from({length:7},(_,i)=>new Date(s.getTime()+((w-1)*7+i)*86400000))}
function weekCompletion(w){let done=0,total=0;weekDates(w).forEach(d=>{const c=completionForDate(d);done+=c.n;total+=c.total});return Math.round(done/total*100)}
function overallCompletion(){let done=0,total=0;for(let w=1;w<=52;w++)weekDates(w).forEach(d=>{const c=completionForDate(d);done+=c.n;total+=c.total});return Math.round(done/total*100)}
function fmt(d){return `${d.getMonth()+1}월 ${d.getDate()}일 (${dayNames[d.getDay()]})`}
function renderToday(){const el=document.querySelector('#today'),now=new Date(),w=currentWeek(now),phase=phaseFor(w),type=dayType(now.getDay(),w),tasks=taskSet(type,w),comp=completionForDate(now);const typeName={long:'Long Training Day',short:'Short Skill Day',portfolio:'Portfolio Day',rest:'Rest Day'}[type];el.innerHTML=`<div class="hero"><div class="eyebrow">ARTIST TRAINING · 52 WEEK SYSTEM</div><h1>${fmt(now)}</h1><div class="muted">52주 중 <b>${w}주차</b> · ${typeName}</div></div><div class="card"><div class="row between"><span class="pill accent">${phase.title}</span><span class="pill blue">WEEK ${w}</span></div><div class="focus"><b>이번 주 Focus</b><span>${weeklyFocus[w-1]}</span></div><div class="muted">${phase.goal}</div></div><div class="card"><div class="row between"><h2>오늘의 훈련</h2><b>${comp.pct}%</b></div><div class="progress"><i style="width:${comp.pct}%"></i></div>${tasks.map((t,i)=>`<div class="task ${data.checks[checkKey(now,i)]?'done':''}" data-i="${i}"><button class="check" aria-label="완료 체크"></button><div><div class="task-title">${t[0]}</div><div class="task-meta">${t[1]}</div></div></div>`).join('')}</div><div class="card"><h2>오늘의 원칙</h2><div class="quote">“오늘 무엇을 더 잘 그렸는가”보다<br>“오늘 무엇을 더 잘 판단하게 되었는가.”</div></div>`;el.querySelectorAll('.task').forEach(x=>x.onclick=()=>{const k=checkKey(now,+x.dataset.i);data.checks[k]=!data.checks[k];save();renderAll()})}
function renderWeek(){const el=document.querySelector('#week'),w=currentWeek(),dates=weekDates(w);el.innerHTML=`<div class="hero"><div class="eyebrow">WEEKLY PLAN</div><h1>${w}주차 · ${weeklyFocus[w-1]}</h1><div class="muted">금요일은 ${isLongFriday(w)?'Long Training':'Short Skill'} 주간</div></div><div class="card"><div class="row between"><h2>이번 주 진행률</h2><b>${weekCompletion(w)}%</b></div><div class="progress"><i style="width:${weekCompletion(w)}%"></i></div>${dates.map(d=>{const t=dayType(d.getDay(),w),c=completionForDate(d);return `<div class="dayline"><div class="row between"><strong>${fmt(d)}</strong><span class="pill">${c.pct}%</span></div><small>${{long:'Long · 훈련 + Deep Work',short:'Short · Skill 중심',portfolio:'Portfolio · 작품만',rest:'Rest · 완전 휴식'}[t]}</small></div>`}).join('')}</div><div class="card"><h2>주차 과제</h2><div class="focus"><b>${weeklyFocus[w-1]}</b><span class="muted">${phaseFor(w).desc}</span></div></div>`}
function renderRoadmap(){const el=document.querySelector('#roadmap'),w=currentWeek();el.innerHTML=`<div class="hero"><div class="eyebrow">52 WEEK ROADMAP</div><h1>1년 성장 지도</h1><div class="muted">현재 ${w}주차 · 전체 체크 진행 ${overallCompletion()}%</div></div>${phases.map(p=>`<div class="phase"><b>${p.title}</b><p>${p.from}–${p.to}주 · ${p.desc}</p></div>`).join('')}<div class="card"><div class="week-grid">${Array.from({length:52},(_,i)=>i+1).map(n=>`<button class="week-btn ${n===w?'current':''} ${weekCompletion(n)>=80?'done':''}" data-w="${n}">${n}주<br><span class="tiny">${weekCompletion(n)}%</span></button>`).join('')}</div></div><div id="weekDetail"></div>`;el.querySelectorAll('.week-btn').forEach(b=>b.onclick=()=>renderWeekDetail(+b.dataset.w));renderWeekDetail(w)}
function renderWeekDetail(w){const p=phaseFor(w);document.querySelector('#weekDetail').innerHTML=`<div class="card"><div class="row between"><h2>${w}주차 상세</h2><span class="pill accent">${weeklyFocus[w-1]}</span></div><div class="muted">${p.goal}</div><div class="focus"><b>월·수${isLongFriday(w)?'·금':''}</b><span>크로키 → 구도 → Skill → 분석 → 실제 작품 Deep Work</span></div><div class="focus"><b>화·목${!isLongFriday(w)?'·금':''}</b><span>짧은 Skill Day. 크로키 → 구도 → Master/Skill Study → 리뷰</span></div><div class="focus"><b>토</b><span>Portfolio Deep Work 3시간 + 주간 리뷰</span></div><div class="focus"><b>일</b><span>완전 휴식</span></div></div>`}
function renderReview(){const el=document.querySelector('#review'),w=currentWeek();const n=data.notes[w]||{keep:'',problem:'',next:''};el.innerHTML=`<div class="hero"><div class="eyebrow">ART REVIEW</div><h1>${w}주차 기록</h1><div class="muted">반복되는 약점을 발견하는 것이 목적이다.</div></div><div class="card review"><h2>KEEP</h2><div class="muted">이번 주 계속 유지할 좋은 판단</div><textarea id="keep">${n.keep||''}</textarea><h2>PROBLEM</h2><div class="muted">가장 큰 문제 하나</div><textarea id="problem">${n.problem||''}</textarea><h2>NEXT</h2><div class="muted">다음 주 가장 먼저 고칠 것 하나</div><textarea id="next">${n.next||''}</textarea><button class="btn" id="saveReview">기록 저장</button></div>`;el.querySelector('#saveReview').onclick=()=>{data.notes[w]={keep:el.querySelector('#keep').value,problem:el.querySelector('#problem').value,next:el.querySelector('#next').value};save();alert('저장했어.')}}
function renderSettings(){const el=document.querySelector('#settings');el.innerHTML=`<div class="hero"><div class="eyebrow">SETTINGS</div><h1>훈련 설정</h1><div class="muted">시작일과 금요일 교대 패턴을 바꿀 수 있다.</div></div><div class="card settings"><label>52주 시작일</label><input id="startDate" type="date" value="${data.startDate}"><label>1주차 금요일</label><select id="friday"><option value="odd" ${data.longFridayOnOdd?'selected':''}>Long Training Day</option><option value="even" ${!data.longFridayOnOdd?'selected':''}>Short Skill Day</option></select><label>실제 작품 / 프로젝트 이름</label><input id="target" value="${data.targetName}"><div style="height:14px"></div><button class="btn" id="saveSet">설정 저장</button> <button class="btn ghost" id="backup">기록 백업</button></div><div class="card"><h2>근무 기준</h2><div class="muted">월·수 17:00–23:00 → Long Day<br>화·목 13:00–21:00 → Short Day<br>금요일 → 격주 자동 전환<br>토 → Portfolio Day<br>일 → Rest Day</div></div><div class="card"><h2>주의</h2><div class="muted">밤 11시 이후 추가 그림 공부를 넣지 않는다. 운동과 회복을 줄여 작업시간을 억지로 늘리지 않는다.</div></div>`;el.querySelector('#saveSet').onclick=()=>{data.startDate=el.querySelector('#startDate').value;data.longFridayOnOdd=el.querySelector('#friday').value==='odd';data.targetName=el.querySelector('#target').value.trim()||defaults.targetName;save();renderAll();alert('설정을 저장했어.')};el.querySelector('#backup').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='artist-training-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
function renderAll(){renderToday();renderWeek();renderRoadmap();renderReview();renderSettings()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelector('#'+t.dataset.view).classList.add('active');window.scrollTo(0,0)});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
renderAll();
</script>
<script src="./progress-addon.js?v=20260908-final"></script>
</body></html>
