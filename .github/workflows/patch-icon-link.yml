name: Patch iPhone icon link

on:
  push:
    paths:
      - '.github/workflows/patch-icon-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point app to verified touch icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<link rel="apple-touch-icon" href="icons/icon-180.png" />','<link rel="apple-touch-icon" sizes="120x120" href="./apple-touch-icon.png?v=12" />')
          p.write_text(s)
          PY
          grep -n "apple-touch-icon" index.html

      - name: Commit link fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Point iPhone install to verified touch icon"
            git push
          fi
