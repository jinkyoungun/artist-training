name: Fill Icon Background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fill-icon-background.yml'

permissions:
  contents: write

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick pngcheck

      - name: Remove white outer background only
        run: |
          mkdir -p icons
          cp apple-touch-icon.png /tmp/icon-before.png
          convert /tmp/icon-before.png -fuzz 45% -fill '#1a1e21' -draw 'color 0,0 floodfill' PNG24:apple-touch-icon.png
          convert apple-touch-icon.png -resize 192x192 -colorspace sRGB -strip PNG24:icons/icon-192.png
          convert apple-touch-icon.png -resize 512x512 -colorspace sRGB -strip PNG24:icons/icon-512.png

      - name: Verify icons
        run: |
          pngcheck -q apple-touch-icon.png icons/icon-192.png icons/icon-512.png
          test "$(identify -format '%wx%h' apple-touch-icon.png)" = '180x180'
          test "$(identify -format '%wx%h' icons/icon-192.png)" = '192x192'
          test "$(identify -format '%wx%h' icons/icon-512.png)" = '512x512'
          corner=$(convert apple-touch-icon.png -format '%[pixel:p{0,0}]' info:)
          echo "corner=$corner"
          case "$corner" in
            *255*|*254*|*253*) echo 'white corner remains'; exit 1;;
          esac

      - name: Commit icon-only change
        run: |
          rm -rf .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apple-touch-icon.png icons/icon-192.png icons/icon-512.png .github
          git commit -m 'Fill PWA icon background edge to edge'
          git push origin HEAD:main
