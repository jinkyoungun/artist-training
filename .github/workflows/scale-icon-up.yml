name: Scale Icon Up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scale-icon-up.yml'

permissions:
  contents: write

jobs:
  scale-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick pngcheck

      - name: Restore approved icon source and scale whole icon up
        run: |
          git show a4db230ab5c29b8a1b0e3d1d58e808e48338fb75:apple-touch-icon.png > /tmp/source.png
          test "$(identify -format '%wx%h' /tmp/source.png)" = '180x180'
          # Enlarge the WHOLE existing icon: crop 11 px from every side,
          # then scale the remaining icon back to 180x180.
          # No background painting/filling is performed.
          convert /tmp/source.png -crop 158x158+11+11 +repage -resize 180x180! -alpha off -colorspace sRGB -strip PNG24:apple-touch-icon.png
          mkdir -p icons
          convert apple-touch-icon.png -resize 192x192! -colorspace sRGB -strip PNG24:icons/icon-192.png
          convert apple-touch-icon.png -resize 512x512! -colorspace sRGB -strip PNG24:icons/icon-512.png

      - name: Verify scaled icons
        run: |
          pngcheck -q apple-touch-icon.png icons/icon-192.png icons/icon-512.png
          test "$(identify -format '%wx%h' apple-touch-icon.png)" = '180x180'
          test "$(identify -format '%wx%h' icons/icon-192.png)" = '192x192'
          test "$(identify -format '%wx%h' icons/icon-512.png)" = '512x512'
          echo "corners: $(convert apple-touch-icon.png -format '%[pixel:p{0,0}] %[pixel:p{179,0}] %[pixel:p{0,179}] %[pixel:p{179,179}]' info:)"

      - name: Refresh icon URL only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(apple-touch-icon\.png\?v=)[^\"\']+', r'\g<1>20260909-scaleup', s)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit icon-only update
        run: |
          rm -rf .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apple-touch-icon.png icons/icon-192.png icons/icon-512.png index.html .github
          git commit -m 'Scale PWA icon up to fill former white margin'
          git push origin HEAD:main
