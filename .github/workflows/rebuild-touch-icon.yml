name: Rebuild iPhone touch icon

on:
  push:
    paths:
      - '.github/workflows/rebuild-touch-icon.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode verified icon bytes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d verified-touch-120.base64.txt > apple-touch-icon.png
          cp apple-touch-icon.png apple-touch-icon-120x120.png
          file apple-touch-icon.png
          sha1sum apple-touch-icon.png

      - name: Commit repaired PNG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png apple-touch-icon-120x120.png
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Rebuild verified iPhone touch icon"
            git push
          fi
