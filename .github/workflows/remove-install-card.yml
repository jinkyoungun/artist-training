name: Remove install guidance card
on:
  push:
    paths:
      - '.github/workflows/remove-install-card.yml'
permissions:
  contents: write
jobs:
  remove-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only iPhone install guidance card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          target='<div class="card install"><h2>iPhone 앱처럼 사용</h2><div class="muted">Safari에서 이 사이트를 연 뒤 <b>공유 → 홈 화면에 추가</b>를 선택하면 독립 앱처럼 실행할 수 있다.</div></div>'
          if target not in s:
              raise SystemExit('target install card not found; aborting without changes')
          s=s.replace(target,'',1)
          p.write_text(s)
          sw=Path('sw.js')
          w=sw.read_text()
          m=re.search(r"const CACHE='([^']+)';", w)
          if not m:
              raise SystemExit('service worker cache declaration not found; aborting')
          old=m.group(1)
          nums=re.findall(r'\d+', old)
          if nums:
              last=nums[-1]
              new=old[:old.rfind(last)] + str(int(last)+1) + old[old.rfind(last)+len(last):]
          else:
              new=old+'-1'
          w=w.replace("const CACHE='"+old+"';", "const CACHE='"+new+"';", 1)
          sw.write_text(w)
          print('Removed install card only; cache', old, '->', new)
          PY
      - name: Commit minimal UI change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Remove iPhone install guidance card'
          git push
