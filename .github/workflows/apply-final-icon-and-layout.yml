name: Apply final icon and layout
on:
  push:
    paths:
      - '.github/workflows/apply-final-icon-and-layout.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect icon chunk hashes
        run: |
          sha256sum icon_chunks/final-180.part0a icon_chunks/final-180.part0b icon_chunks/final-180.part0c icon_chunks/final-180.part0d icon_chunks/final-180.p04 icon_chunks/final-180.p05 icon_chunks/final-180.p06 icon_chunks/final-180.p07 icon_chunks/final-180.p08 icon_chunks/final-180.p09 icon_chunks/final-180.p10 icon_chunks/final-180.p11 icon_chunks/final-180.p12 icon_chunks/final-180.p13 icon_chunks/final-180.p14 icon_chunks/final-180.p15 icon_chunks/final-180.p16 icon_chunks/final-180.p17 icon_chunks/final-180.p18 icon_chunks/final-180.p19 icon_chunks/final-180.p20 icon_chunks/final-180.p21 icon_chunks/final-180.p22
