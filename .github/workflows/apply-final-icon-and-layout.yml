name: Apply final icon and layout
on:
  push:
    paths:
      - '.github/workflows/apply-final-icon-and-layout.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
      - name: Build and verify final app icons
        run: |
          cat icon_chunks/final-180.part0a icon_chunks/final-180.part0b icon_chunks/final-180.part0c icon_chunks/final-180.part0d icon_chunks/final-180.p04 icon_chunks/final-180.p05 icon_chunks/final-180.p06 icon_chunks/final-180.p07 icon_chunks/final-180.p08 icon_chunks/final-180.p09 icon_chunks/final-180.p10 icon_chunks/final-180.p11 icon_chunks/final-180.p12 icon_chunks/final-180.p13 icon_chunks/final-180.p14 icon_chunks/final-180.p15 icon_chunks/final-180.p16 icon_chunks/final-180.p17 icon_chunks/final-180.p18 icon_chunks/final-180.p19 icon_chunks/final-180.p20 icon_chunks/final-180.p21 icon_chunks/final-180.p22 | tr -d '\n\r ' | base64 -d > apple-touch-icon.png
          echo 'd2c37c0f7214eee55ce0f8996f39c1b8fa2298ad546e1fef7ec56ae1b3392fa7  apple-touch-icon.png' | sha256sum -c -
          mkdir -p icons
          cp apple-touch-icon.png icons/icon-180.png
          convert apple-touch-icon.png -resize 192x192 icons/icon-192.png
          convert apple-touch-icon.png -resize 512x512 icons/icon-512.png
          identify apple-touch-icon.png icons/icon-192.png icons/icon-512.png
      - name: Patch app layout and cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=13" />', s, count=1)
          old='.settings input[type="date"]{width:100%;max-width:100%;min-width:0;display:block;box-sizing:border-box;-webkit-appearance:none;appearance:none;}'
          new='.settings{min-width:0;overflow:hidden}.settings input,.settings select{width:100%;max-width:100%;min-width:0;box-sizing:border-box}.settings input[type="date"]{width:100%;inline-size:100%;max-width:100%;max-inline-size:100%;min-width:0;min-inline-size:0;display:block;box-sizing:border-box;-webkit-appearance:none;appearance:none;font-size:16px;}'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              s=s.replace('</style>',new+'\n</style>')
          p.write_text(s)
          sw=Path('sw.js')
          w=sw.read_text()
          w=re.sub(r"const CACHE='artist-training-v[^']+';", "const CACHE='artist-training-v2-8';", w)
          sw.write_text(w)
          PY
      - name: Commit final icon and layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apple-touch-icon.png icons/icon-180.png icons/icon-192.png icons/icon-512.png index.html sw.js
          git diff --cached --quiet || git commit -m 'Apply final metallic A icon and fix iPhone date layout'
          git push
