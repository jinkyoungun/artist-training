name: Build Clean Final

on:
  push:
    branches: [clean-rebuild-final]
    paths:
      - '.github/workflows/build-clean-final.yml'
      - 'icon_source/q256fix/**'
      - 'icon_source/q256/part02.b64'
      - 'icon_source/q256/part03.b64'
      - 'icon_source/q256/part04.b64'
      - 'icon_source/q256/part05.b64'
      - 'icon_source/q256/part06.b64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-rebuild-final
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick pngcheck

      - name: Build and verify icons
        run: |
          mkdir -p icons
          cat icon_source/q256fix/part00.b64 \
              icon_source/q256fix/part01.b64 \
              icon_source/q256fix/part02.b64 \
              icon_source/q256fix/part03.b64 \
              icon_source/q256fix/part04.b64 \
              icon_source/q256fix/part05.b64 \
              icon_source/q256fix/part06.b64 \
              icon_source/q256fix/part07.b64 \
              icon_source/q256/part02.b64 \
              icon_source/q256/part03.b64 \
              icon_source/q256/part04.b64 \
              icon_source/q256/part05.b64 \
              icon_source/q256/part06.b64 > /tmp/icon.b64
          tr -d '\n\r ' < /tmp/icon.b64 | base64 -d > apple-touch-icon.png
          echo '631c44ca4cffdbe9b5a3f3b2ed242e7da683f391eeb9613cf6e7ddf924e7c576  apple-touch-icon.png' | sha256sum -c -
          pngcheck -q apple-touch-icon.png
          test "$(identify -format '%wx%h' apple-touch-icon.png)" = '180x180'
          convert apple-touch-icon.png -resize 192x192 -colorspace sRGB -strip PNG24:icons/icon-192.png
          convert apple-touch-icon.png -resize 512x512 -colorspace sRGB -strip PNG24:icons/icon-512.png
          pngcheck -q icons/icon-192.png
          pngcheck -q icons/icon-512.png
          test "$(identify -format '%wx%h' icons/icon-192.png)" = '192x192'
          test "$(identify -format '%wx%h' icons/icon-512.png)" = '512x512'

      - name: Patch final app HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<div class="card install">.*?</div></div>', '', s, flags=re.S)
          s=s.replace('.install{background:linear-gradient(135deg,rgba(212,166,74,.16),rgba(126,176,255,.08));border-color:#4d4330}', '')
          s=re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260908-final" />', s)
          s=re.sub(r'<link rel="manifest"[^>]*>', '<link rel="manifest" href="./manifest.webmanifest?v=20260908-final" />', s)
          s=s.replace('./progress-addon.css?v=2.7','./progress-addon.css?v=20260908-final')
          s=s.replace('./progress-addon.js?v=2.7','./progress-addon.js?v=20260908-final')
          if 'iPhone 앱처럼 사용' in s or 'Safari에서 이 사이트를 연 뒤' in s:
              raise SystemExit('install guidance still present')
          if "const STORAGE='proArtist52_v2'" not in s:
              raise SystemExit('storage key changed')
          if 'progress-addon.js' not in s:
              raise SystemExit('progress addon missing')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Write clean manifest
        run: |
          cat > manifest.webmanifest <<'EOF'
          {
            "name": "Artist Training · 52주 프로 아티스트 훈련",
            "short_name": "Artist Training",
            "start_url": "./index.html",
            "scope": "./",
            "display": "standalone",
            "background_color": "#0d0f12",
            "theme_color": "#0d0f12",
            "orientation": "portrait-primary",
            "icons": [
              {"src":"./icons/icon-192.png","sizes":"192x192","type":"image/png"},
              {"src":"./icons/icon-512.png","sizes":"512x512","type":"image/png"}
            ]
          }
          EOF

      - name: Write clean service worker
        run: |
          cat > sw.js <<'EOF'
          const CACHE='artist-training-final-20260908-1';
          const ASSETS=[
            './index.html',
            './manifest.webmanifest',
            './progress-addon.css',
            './progress-addon.js',
            './apple-touch-icon.png',
            './icons/icon-192.png',
            './icons/icon-512.png'
          ];
          self.addEventListener('install',event=>{
            event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(ASSETS)).then(()=>self.skipWaiting()));
          });
          self.addEventListener('activate',event=>{
            event.waitUntil(Promise.all([
              self.clients.claim(),
              caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))
            ]));
          });
          self.addEventListener('fetch',event=>{
            if(event.request.mode==='navigate'){
              event.respondWith(
                fetch(event.request,{cache:'no-store'})
                  .then(response=>{
                    const copy=response.clone();
                    caches.open(CACHE).then(cache=>cache.put('./index.html',copy));
                    return response;
                  })
                  .catch(()=>caches.match('./index.html'))
              );
              return;
            }
            event.respondWith(caches.match(event.request).then(cached=>cached||fetch(event.request)));
          });
          EOF

      - name: Final checks
        run: |
          ! grep -q 'iPhone 앱처럼 사용' index.html
          ! grep -q 'Safari에서 이 사이트를 연 뒤' index.html
          grep -q "proArtist52_v2" index.html
          grep -q 'progress-addon.js' index.html
          grep -q 'apple-touch-icon.png?v=20260908-final' index.html
          grep -q '192x192' manifest.webmanifest
          grep -q '512x512' manifest.webmanifest
          pngcheck -q apple-touch-icon.png icons/icon-192.png icons/icon-512.png
          test "$(identify -format '%wx%h' apple-touch-icon.png)" = '180x180'
          test "$(identify -format '%wx%h' icons/icon-192.png)" = '192x192'
          test "$(identify -format '%wx%h' icons/icon-512.png)" = '512x512'

      - name: Remove rebuild-only files and commit final branch
        run: |
          rm -rf icon_source .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean rebuild final Artist Training PWA'
          git push origin HEAD:clean-rebuild-final
