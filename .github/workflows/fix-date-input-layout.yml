name: Fix iPhone date input layout
on:
  push:
    paths:
      - '.github/workflows/fix-date-input-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Constrain date input inside settings card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          rule='.settings input[type="date"]{width:100%;max-width:100%;min-width:0;display:block;box-sizing:border-box;-webkit-appearance:none;appearance:none;}'
          if rule not in s:
              s=s.replace('</style>', rule+'\n</style>')
          p.write_text(s)
          PY
      - name: Commit layout fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix iPhone date input overflow in settings'
          git push
