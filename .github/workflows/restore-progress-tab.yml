name: Restore progress graph tab
on:
  push:
    paths:
      - '.github/workflows/restore-progress-tab.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Inject progress assets into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="./progress-addon.css?v=2.7" />'
          js='<script src="./progress-addon.js?v=2.7"></script>'
          if 'progress-addon.css' not in s:
              s=s.replace('</head>', css+'\n</head>')
          if 'progress-addon.js' not in s:
              s=s.replace('</body>', js+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit restored progress tab
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then
            echo 'Progress assets already present'
          else
            git commit -m 'Restore progress graph tab in main app'
            git push origin main
          fi
