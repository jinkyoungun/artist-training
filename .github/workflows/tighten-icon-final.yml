name: Tighten Icon Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tighten-icon-final.yml'

permissions:
  contents: write

jobs:
  tighten-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick pngcheck

      - name: Enlarge whole icon until white rim is gone
        run: |
          cp apple-touch-icon.png /tmp/current.png
          # Crop a further 18px from every edge of the CURRENT icon.
          # This enlarges the entire dark rounded-square + A symbol together;
          # no background painting/filling is performed.
          convert /tmp/current.png \
            -crop 144x144+18+18 +repage \
            -resize 180x180! \
            -colorspace sRGB -strip PNG24:apple-touch-icon.png

          mkdir -p icons
          convert apple-touch-icon.png -resize 192x192! -colorspace sRGB -strip PNG24:icons/icon-192.png
          convert apple-touch-icon.png -resize 512x512! -colorspace sRGB -strip PNG24:icons/icon-512.png

      - name: Verify PNG files and dimensions
        run: |
          pngcheck -q apple-touch-icon.png icons/icon-192.png icons/icon-512.png
          test "$(identify -format '%wx%h' apple-touch-icon.png)" = '180x180'
          test "$(identify -format '%wx%h' icons/icon-192.png)" = '192x192'
          test "$(identify -format '%wx%h' icons/icon-512.png)" = '512x512'

      - name: Refresh iPhone icon URL only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if re.search(r'apple-touch-icon\.png\?v=', s):
              s=re.sub(r'(apple-touch-icon\.png\?v=)[^\"\']+', r'\g<1>20260909-tight-final', s)
          else:
              s=s.replace('apple-touch-icon.png', 'apple-touch-icon.png?v=20260909-tight-final', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit icon-only update and remove workflow
        run: |
          rm -rf .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apple-touch-icon.png icons/icon-192.png icons/icon-512.png index.html .github
          git commit -m 'Enlarge PWA icon to eliminate remaining white rim'
          git push origin HEAD:main
