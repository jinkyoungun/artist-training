name: Crop Icon To Content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crop-icon-to-content.yml'

permissions:
  contents: write

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick pngcheck

      - name: Crop white frame and expand dark icon
        run: |
          cp apple-touch-icon.png /tmp/source.png
          # Remove the connected outer light frame, crop to the actual dark icon,
          # then scale that icon to the full iOS canvas.
          convert /tmp/source.png \
            -bordercolor white -border 1 \
            -fuzz 14% -trim +repage \
            -resize 180x180! \
            /tmp/cropped.png

          # Any residual light pixels connected to the four corners belong to the
          # former outer frame. Replace only those connected corner regions with
          # the icon's charcoal background so no white rim remains.
          convert /tmp/cropped.png \
            -fuzz 22% \
            -fill '#1a1e21' \
            -draw 'matte 0,0 floodfill' \
            -draw 'matte 179,0 floodfill' \
            -draw 'matte 0,179 floodfill' \
            -draw 'matte 179,179 floodfill' \
            -alpha off -colorspace sRGB -strip PNG24:apple-touch-icon.png

          mkdir -p icons
          convert apple-touch-icon.png -resize 192x192! -colorspace sRGB -strip PNG24:icons/icon-192.png
          convert apple-touch-icon.png -resize 512x512! -colorspace sRGB -strip PNG24:icons/icon-512.png

      - name: Verify edge-to-edge icon
        run: |
          pngcheck -q apple-touch-icon.png icons/icon-192.png icons/icon-512.png
          test "$(identify -format '%wx%h' apple-touch-icon.png)" = '180x180'
          test "$(identify -format '%wx%h' icons/icon-192.png)" = '192x192'
          test "$(identify -format '%wx%h' icons/icon-512.png)" = '512x512'
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('apple-touch-icon.png').convert('RGB')
          pts=[(0,0),(179,0),(0,179),(179,179)]
          vals=[im.getpixel(p) for p in pts]
          print('corner pixels:', vals)
          if any(max(v) > 100 for v in vals):
              raise SystemExit('outer white/light frame still present')
          PY

      - name: Refresh only icon URL version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(apple-touch-icon\.png\?v=)[^\"\']+', r'\g<1>20260909-edge2', s)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit icon-only fix and remove workflow
        run: |
          rm -rf .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apple-touch-icon.png icons/icon-192.png icons/icon-512.png index.html .github
          git commit -m 'Crop PWA icon to dark content edge-to-edge'
          git push origin HEAD:main
